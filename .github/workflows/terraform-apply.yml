name: Terraform Apply

on:
  push:
    branches: [main]
    paths: ["infra/**", "lambda/**", "frontend/**"]
  workflow_dispatch: {} # manual trigger from the Actions tab

permissions:
  id-token: write # required to authenticate against AWS via OIDC
  contents: read

concurrency:
  group: terraform-covenas-dashboard
  cancel-in-progress: false # never cancel a plan/apply mid-flight

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # manual approval gate — see Settings → Environments → production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.15"

      # Construye el paquete Lambda ANTES de Terraform. El data.archive_file
      # lee infra/build/package en tiempo de refresh; en un checkout limpio de
      # CI ese directorio no existe (el null_resource no corre a tiempo), así
      # que lo generamos aquí explícitamente. Mismo pip install que el
      # null_resource lambda_build (Linux x86_64 wheels).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf infra/build/package
          mkdir -p infra/build/package
          pip3 install --no-cache-dir --quiet \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -r lambda/requirements.txt \
            -t infra/build/package
          cp lambda/handler.py infra/build/package/handler.py

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: |
          terraform apply -auto-approve -no-color \
            -var "google_spreadsheet_id=${{ vars.GOOGLE_SPREADSHEET_ID }}"

      - name: Publish outputs to job summary
        run: |
          echo '### Dashboard URLs' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform output >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
