name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "lambda/**", "frontend/**"]

permissions:
  id-token: write # required to authenticate against AWS via OIDC
  contents: read

concurrency:
  group: terraform-covenas-dashboard
  cancel-in-progress: false # never cancel a plan/apply mid-flight

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.15"

      # Construye el paquete Lambda antes de Terraform (ver nota en
      # terraform-apply.yml): el data.archive_file necesita infra/build/package
      # en tiempo de refresh, que no existe en un checkout limpio de CI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf infra/build/package
          mkdir -p infra/build/package
          pip3 install --no-cache-dir --quiet \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -r lambda/requirements.txt \
            -t infra/build/package
          cp lambda/handler.py infra/build/package/handler.py

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          terraform plan -no-color \
            -var "google_spreadsheet_id=${{ vars.GOOGLE_SPREADSHEET_ID }}" \
            | tee /tmp/plan.txt

      - name: Publish plan to job summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
